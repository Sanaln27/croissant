<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croissant</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
}

#chat {
  max-width: 850px;
  margin: auto;
  padding: 50px 32px 150px;
}

.message {
  padding: 18px 22px;
  margin-bottom: 18px;
  border-radius: 20px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #292929;
  margin-left: auto;
}

.agent {
  background: transparent;
  margin-right: auto;
}

#input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 100;
  padding: 24px 32px 30px;
  background: linear-gradient(transparent, #111 20%);
}

#input-container {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 12px;
  padding: 8px;
  background: #242424;
  border: 1px solid #383838;
  border-radius: 50px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 12px 18px;
  font-size: 15px;
}

input::placeholder { color: #777; }

button {
  border: none;
  border-radius: 50px;
  background: #eee;
  color: #111;
  padding: 0 25px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#status {
  max-width: 850px;
  margin: 0 auto 10px;
  padding-left: 20px;
  font-size: 12px;
  color: #777;
  height: 14px;
}

@media (max-width: 600px) {
  #chat { padding: 25px 18px 140px; }
  #input-area { padding: 18px 14px 22px; }
  .message { max-width: 95%; }
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="input-area">
  <div id="status"></div>
  <div id="input-container">
    <input
      id="query"
      placeholder="Message..."
      autocomplete="off"
    />
    <button id="send" onclick="send()">Send</button>
  </div>
</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("query");
const button = document.getElementById("send");
const status = document.getElementById("status");

let busy = false;

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = `message ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

async function send() {
  const query = input.value.trim();
  if (!query || busy) return;

  busy = true;
  button.disabled = true;
  input.disabled = true;

  addMessage(query, "user");
  input.value = "";

  const response = addMessage("Thinking...", "agent");
  status.textContent = "PROCESSING";

  try {
    const res = await fetch(
      `http://localhost:8000/croissant?query=${encodeURIComponent(query)}`,
      { method: "POST" }
    );

    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    response.textContent = await res.text();
  } catch (err) {
    response.textContent = `Error: ${err.message}`;
  } finally {
    busy = false;
    button.disabled = false;
    input.disabled = false;
    status.textContent = "";
    input.focus();
  }
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
