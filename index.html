
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croissant</title>

<link rel="icon" type="image/png" href="assests/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

@font-face {
  font-family: "Eagle Horizon";
  src: url("assests/EagleHorizonP.ttf") format("truetype");
  font-display: swap;
}

:root {
  --page-text: #3d3027;
  --muted-text: #8a7567;
  --user-message: rgba(235, 218, 198, 0.94);
  --panel: rgba(255, 252, 247, 0.92);
  --panel-border: rgba(126, 91, 63, 0.2);
  --accent: #795438;
}

body {
  margin: 0;
  background: #f7f1e9 url("assests/bg.png") center / cover fixed no-repeat;
  color: var(--page-text);
  font-family: Arial, sans-serif;
  overflow-x: hidden;
}

/* Decorative flourishes */

.flourish {
  position: fixed;
  z-index: 1;
  opacity: 0.42;
  pointer-events: none;
  user-select: none;
}

.flourish-top-center,
.flourish-bottom-center {
  left: 50%;
  width: min(52vw, 470px);
  height: auto;
  transform: translateX(-50%);
}

.flourish-top-center {
  top: 0;
}

.flourish-bottom-center {
  bottom: 0;
}

.flourish-top-left,
.flourish-top-right,
.flourish-bottom-left,
.flourish-bottom-right {
  width: min(22vw, 220px);
  height: auto;
}

.flourish-top-left {
  top: 0;
  left: 0;
}

.flourish-top-right {
  top: 0;
  right: 0;
}

.flourish-bottom-left {
  bottom: 0;
  left: 0;
}

.flourish-bottom-right {
  right: 0;
  bottom: 0;
}

.scatter {
  position: fixed;
  z-index: 0;
  height: auto;
  pointer-events: none;
  user-select: none;
  transition: opacity 2.8s ease;
}

body.started .scatter {
  opacity: 0.04 !important;
}

/* Chat */

#chat {
  max-width: 850px;
  margin: auto;
  padding: 50px 32px 170px;
}

.message {
  padding: 18px 22px;
  margin-bottom: 18px;
  border-radius: 20px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: var(--user-message);
  margin-left: auto;
}

/* Agent messages */

.agent-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 22px;
}

.agent-avatar {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  object-fit: contain;
}

.agent {
  background: transparent;
  margin: 0;
  padding: 12px 0;
  max-width: 85%;
}

/* Input area */

#input-area {
  position: fixed;
  top: 50%;
  left: 0;
  width: 100%;
  z-index: 100;
  padding: 24px 32px 30px;
  transform: translateY(-50%);
  transition: top 1.1s cubic-bezier(0.22, 1, 0.36, 1),
              transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

body.started #input-area {
  top: calc(100% - 205px);
  transform: translateY(0);
}

#input-area::before {
  content: "";
  position: absolute;
  z-index: 0;
  left: 10%;
  right: 10%;
  bottom: -40px;
  height: 190px;
  border-radius: 50%;
  background: radial-gradient(
    ellipse,
    rgba(45, 31, 24, 0.28) 0%,
    rgba(45, 31, 24, 0.16) 42%,
    transparent 74%
  );
  filter: blur(20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.1s ease;
}

body.started #input-area::before {
  opacity: 1;
}

/* Branding */

#branding {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 28px;
  font-family: "Eagle Horizon", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  font-size: 56px;
  letter-spacing: 0.02em;
  color: var(--page-text);
  transition: opacity 0.8s ease,
              transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
              height 0.8s ease,
              margin 0.8s ease;
}

#branding img {
  width: 120px;
  height: 120px;
  object-fit: contain;
}

#branding strong {
  font-weight: 600;
}

body.started #branding {
  opacity: 0;
  transform: translateY(-25px) scale(0.95);
  pointer-events: none;
  height: 0;
  margin: 0;
  overflow: hidden;
}

/* Input */

#input-container {
  position: relative;
  z-index: 1;
  max-width: 850px;
  aspect-ratio: 629 / 117;
  margin: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 30px 82px 22px 34px;
  background: transparent url("assests/input oven.png") center / 100% 100% no-repeat;
  transform-origin: bottom center;
  transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

body.started #input-container {
  transform: scale(0.8);
}

input {
  flex: 1;
  min-width: 0;
  position: relative;
  left: 60px;
  top: 20px;
  background: transparent;
  border: none;
  outline: none;
  color: #d0c4b5;
  padding: 8px 12px;
  font-family: "Kalam", cursive;
  font-size: 28px;
  letter-spacing: 0.08em;
}

input::placeholder {
  color: rgba(248, 233, 216, 0.62);
}

button#send {
  --handle-top: 25%;
  --handle-bottom: 70%;
  --handle-snap-threshold: 58%;
  --handle-resistance: 0.7;
  --handle-width: clamp(34px, 6%, 52px);
  --handle-height: 30%;
  position: absolute;
  z-index: 2;
  top: var(--handle-top);
  right: 1.7%;
  width: var(--handle-width);
  height: var(--handle-height);
  padding: 0;
  border: 0;
  background: transparent;
  cursor: grab;
  touch-action: none;
  user-select: none;
  transition: top 80ms ease;
}

button#send::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -10% 12%;
  border-radius: 999px;
  background: linear-gradient(
    to bottom,
    rgba(31, 18, 12, 0.12),
    rgba(31, 18, 12, 0.42) 48%,
    rgba(31, 18, 12, 0.16)
  );
  filter: blur(5px);
  box-shadow: 0 2px 10px rgba(20, 10, 5, 0.28);
}

button#send img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  transform: scale(2);
  transform-origin: center;
  pointer-events: none;
}

button#send.is-dragging {
  cursor: grabbing;
  transition: none;
}

button#send:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* Status */

#status {
  max-width: 850px;
  margin: 0 auto 10px;
  padding-left: 20px;
  font-size: 12px;
  color: var(--muted-text);
  height: 14px;
}

/* Mobile */

@media (max-width: 600px) {
  #chat {
    padding: 25px 18px 150px;
  }

  #input-area {
    padding: 18px 14px 22px;
  }

  #input-container {
    padding: 25px 58px 18px 28px;
  }

  input {
    font-size: 23px;
  }

  body.started #input-container {
    transform: scale(0.9);
  }

  button#send {
    right: 1.5%;
  }

  body.started #input-area {
    top: calc(100% - 195px);
  }

  .message {
    max-width: 95%;
  }

  .agent {
    max-width: calc(100% - 60px);
  }

  .agent-avatar {
    width: 46px;
    height: 46px;
  }

  #branding {
    font-size: 44px;
    gap: 12px;
  }

  #branding img {
    width: 96px;
    height: 96px;
  }
}
</style>
</head>

<body>

<div aria-hidden="true">
  <img class="scatter scatter-baguette" src="assests/Scatter assets/bagget.png" alt="">
  <img class="scatter scatter-croissant" src="assests/Scatter assets/croissant.png" alt="">
  <img class="scatter scatter-cupcake" src="assests/Scatter assets/cupcake.png" alt="">
  <img class="scatter scatter-tea" src="assests/Scatter assets/tea.png" alt="">
  <img class="scatter scatter-tea-container" src="assests/Scatter assets/tea_container.png" alt="">
</div>

<img class="flourish flourish-top-center" src="assests/flourish_svg_assets/top_center_divider.svg" alt="">
<img class="flourish flourish-bottom-center" src="assests/flourish_svg_assets/bottom_center_divider.svg" alt="">
<img class="flourish flourish-top-left" src="assests/flourish_svg_assets/top_left_corner.svg" alt="">
<img class="flourish flourish-top-right" src="assests/flourish_svg_assets/top_right_corner.svg" alt="">
<img class="flourish flourish-bottom-left" src="assests/flourish_svg_assets/bottom_left_corner.svg" alt="">
<img class="flourish flourish-bottom-right" src="assests/flourish_svg_assets/bottom_right_corner.svg" alt="">

<div id="chat"></div>

<div id="input-area">

  <div id="status"></div>

  <div id="branding">
    <img src="assests/logo.png" alt="Croissant">
    <span><strong>Croissant</strong></span>
  </div>

  <div id="input-container">
    <input
      id="query"
      placeholder="Message..."
      autocomplete="off"
    />
    <button id="send" type="button" aria-label="Drag down to send">
      <img src="assests/handle.png" alt="">
    </button>
  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("query");
const button = document.getElementById("send");
const status = document.getElementById("status");
const inputContainer = document.getElementById("input-container");

let busy = false;
let dragStartY = null;
let dragPointerId = null;
let passedSnapThreshold = false;

function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}

function randomInteger(min, max) {
  return Math.floor(randomBetween(min, max + 1));
}

function randomToward(min, max, towardStart) {
  const amount = Math.pow(Math.random(), 1.35);
  return towardStart
    ? min + (max - min) * amount
    : max - (max - min) * amount;
}

function scatterBackgroundAssets() {
  const scatterGroup = document.querySelector("[aria-hidden='true']");
  const templates = [...scatterGroup.querySelectorAll(".scatter")];
  const assets = templates;
  const placements = [];
  const minimumDistance = Math.min(
    180,
    Math.max(100, Math.min(window.innerWidth, window.innerHeight) * 0.22)
  );
  const viewportPadding = 24;
  const centerExclusion = {
    left: window.innerWidth * 0.3,
    right: window.innerWidth * 0.7,
    top: window.innerHeight * 0.28,
    bottom: window.innerHeight * 0.72
  };
  const quadrants = [
    { left: 0, right: 0.5, top: 0, bottom: 0.5 },
    { left: 0.5, right: 1, top: 0, bottom: 0.5 },
    { left: 0, right: 0.5, top: 0.5, bottom: 1 },
    { left: 0.5, right: 1, top: 0.5, bottom: 1 }
  ];

  function candidateFor(quadrant, radius) {
    const xMin = viewportPadding + radius + window.innerWidth * quadrant.left;
    const xMax = window.innerWidth * quadrant.right - viewportPadding - radius;
    const yMin = viewportPadding + radius + window.innerHeight * quadrant.top;
    const yMax = window.innerHeight * quadrant.bottom - viewportPadding - radius;
    const edgeAxis = randomInteger(0, 2);
    const x = edgeAxis === 2
      ? randomBetween(xMin, xMax)
      : randomToward(xMin, xMax, quadrant.left === 0);
    const y = edgeAxis === 1
      ? randomBetween(yMin, yMax)
      : randomToward(yMin, yMax, quadrant.top === 0);
    const isOutsideCenter = (
      x + radius < centerExclusion.left ||
      x - radius > centerExclusion.right ||
      y + radius < centerExclusion.top ||
      y - radius > centerExclusion.bottom
    );
    const isFarEnough = placements.every(previous => {
      const distance = Math.hypot(x - previous.x, y - previous.y);
      return distance >= Math.max(minimumDistance, radius + previous.radius + 20);
    });

    return isOutsideCenter && isFarEnough ? { x, y, radius } : null;
  }

  assets.forEach((asset, index) => {
    const size = randomBetween(120, 180);
    const radius = Math.sqrt(2) * size / 2;
    let placement;
    const requiredQuadrant = index < quadrants.length
      ? quadrants[index]
      : quadrants[randomInteger(0, quadrants.length - 1)];

    for (let attempt = 0; attempt < 1000; attempt++) {
      placement = candidateFor(requiredQuadrant, radius);
      if (placement) {
        break;
      }
    }

    if (!placement) {
      placement = {
        x: randomBetween(
          viewportPadding + radius + window.innerWidth * requiredQuadrant.left,
          window.innerWidth * requiredQuadrant.right - viewportPadding - radius
        ),
        y: randomBetween(
          viewportPadding + radius + window.innerHeight * requiredQuadrant.top,
          window.innerHeight * requiredQuadrant.bottom - viewportPadding - radius
        ),
        radius
      };
    }

    placements.push(placement);
    asset.style.left = `${placement.x}px`;
    asset.style.top = `${placement.y}px`;
    asset.style.width = `${size}px`;
    asset.style.opacity = randomBetween(0.15, 0.35).toFixed(2);
    asset.style.transform = `translate(-50%, -50%) rotate(${randomBetween(-20, 20).toFixed(1)}deg)`;
  });
}

scatterBackgroundAssets();

function addMessage(text, type) {
  if (type === "agent") {
    const row = document.createElement("div");
    row.className = "agent-row";

    const avatar = document.createElement("img");
    avatar.className = "agent-avatar";
    avatar.src = "assests/logo.png";
    avatar.alt = "Agent";

    const div = document.createElement("div");
    div.className = "message agent";
    div.textContent = text;

    row.appendChild(avatar);
    row.appendChild(div);
    chat.appendChild(row);

    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  const div = document.createElement("div");
  div.className = `message ${type}`;
  div.textContent = text;

  chat.appendChild(div);

  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

async function send() {
  const query = input.value.trim();

  if (!query || busy) return;

  busy = true;

  document.body.classList.add("started");

  button.disabled = true;
  input.disabled = true;

  addMessage(query, "user");
  input.value = "";

  const response = addMessage("Thinking...", "agent");

  status.textContent = "PROCESSING";

  try {
    const res = await fetch(
      `https://croissant-mz0o.onrender.com/croissant?query=${encodeURIComponent(query)}`,
      { method: "POST" }
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    response.textContent = await res.text();

  } catch (err) {
    response.textContent = `Error: ${err.message}`;

  } finally {
    busy = false;

    button.disabled = false;
    input.disabled = false;

    status.textContent = "";

    input.focus();

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });
  }
}

function snapHandle(toBottom) {
  button.style.top = toBottom
    ? "var(--handle-bottom)"
    : "var(--handle-top)";
}

function handlePointerDown(event) {
  if (busy) return;

  dragStartY = event.clientY;
  dragPointerId = event.pointerId;
  passedSnapThreshold = false;
  button.classList.add("is-dragging");
  button.setPointerCapture(event.pointerId);
  event.preventDefault();
}

function handlePointerMove(event) {
  if (dragPointerId !== event.pointerId || dragStartY === null) return;

  const bounds = inputContainer.getBoundingClientRect();
  const handleHeight = button.getBoundingClientRect().height;
  const handleStyles = getComputedStyle(button);
  const topLimit = bounds.height *
    (parseFloat(handleStyles.getPropertyValue("--handle-top")) / 100);
  const bottomLimit = bounds.height *
    (parseFloat(handleStyles.getPropertyValue("--handle-bottom")) / 100);
  const halfHandle = handleHeight / 2;
  const handleCenter = event.clientY - bounds.top;
  const snapThreshold = bounds.height *
    (parseFloat(handleStyles.getPropertyValue("--handle-snap-threshold")) / 100);
  const hasText = Boolean(input.value.trim());

  if (hasText && (passedSnapThreshold || handleCenter >= snapThreshold)) {
    passedSnapThreshold = true;
    snapHandle(true);
    event.preventDefault();
    return;
  }

  const position = handleCenter - halfHandle;
  const maximumPosition = bottomLimit - halfHandle;
  const resistanceStart = topLimit + (maximumPosition - topLimit) * 0.72;
  const resistance = parseFloat(
    handleStyles.getPropertyValue("--handle-resistance")
  );
  const resistedPosition = position > resistanceStart
    ? resistanceStart + (position - resistanceStart) * resistance
    : position;
  const clampedPosition = Math.max(
    topLimit - halfHandle,
    Math.min(maximumPosition, resistedPosition)
  );

  button.style.top = `${(clampedPosition / bounds.height) * 100}%`;
  event.preventDefault();
}

function handlePointerUp(event) {
  if (dragPointerId !== event.pointerId || dragStartY === null) return;

  const bounds = inputContainer.getBoundingClientRect();
  const handleStyles = getComputedStyle(button);
  const snapThreshold = bounds.height *
    (parseFloat(handleStyles.getPropertyValue("--handle-snap-threshold")) / 100);
  const releasedBelowThreshold = event.clientY - bounds.top >= snapThreshold;
  const shouldSnapToBottom = Boolean(input.value.trim()) &&
    (passedSnapThreshold || releasedBelowThreshold);
  button.releasePointerCapture(event.pointerId);
  button.classList.remove("is-dragging");
  dragStartY = null;
  dragPointerId = null;

  if (shouldSnapToBottom) {
    snapHandle(true);
    if (input.value.trim()) {
      send();
    }
  } else {
    snapHandle(false);
  }

  passedSnapThreshold = false;
}

button.addEventListener("pointerdown", handlePointerDown);
button.addEventListener("pointermove", handlePointerMove);
button.addEventListener("pointerup", handlePointerUp);
button.addEventListener("pointercancel", handlePointerUp);

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
