
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croissant</title>

<link rel="icon" type="image/png" href="mascot.png">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
}

/* Chat */

#chat {
  max-width: 850px;
  margin: auto;
  padding: 50px 32px 170px;
}

.message {
  padding: 18px 22px;
  margin-bottom: 18px;
  border-radius: 20px;
  max-width: 85%;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  background: #292929;
  margin-left: auto;
}

/* Agent messages */

.agent-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 22px;
}

.agent-avatar {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  object-fit: contain;
}

.agent {
  background: transparent;
  margin: 0;
  padding: 12px 0;
  max-width: 85%;
}

/* Input area */

#input-area {
  position: fixed;
  top: 50%;
  left: 0;
  width: 100%;
  z-index: 100;
  padding: 24px 32px 30px;
  transform: translateY(-50%);
  transition: top 1.1s cubic-bezier(0.22, 1, 0.36, 1),
              transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
}

body.started #input-area {
  top: calc(100% - 136px);
  transform: translateY(0);
  background: linear-gradient(transparent, #111 20%);
}

/* Branding */

#branding {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 28px;
  font-size: 34px;
  color: #eee;
  transition: opacity 0.8s ease,
              transform 0.9s cubic-bezier(0.22, 1, 0.36, 1),
              height 0.8s ease,
              margin 0.8s ease;
}

#branding img {
  width: 76px;
  height: 76px;
  object-fit: contain;
}

#branding strong {
  font-weight: 700;
}

body.started #branding {
  opacity: 0;
  transform: translateY(-25px) scale(0.95);
  pointer-events: none;
  height: 0;
  margin: 0;
  overflow: hidden;
}

/* Input */

#input-container {
  max-width: 850px;
  margin: auto;
  display: flex;
  gap: 12px;
  padding: 8px;
  background: #242424;
  border: 1px solid #383838;
  border-radius: 50px;
}

input {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  padding: 12px 18px;
  font-size: 15px;
}

input::placeholder {
  color: #777;
}

button {
  border: none;
  border-radius: 50px;
  background: #eee;
  color: #111;
  padding: 0 25px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* Status */

#status {
  max-width: 850px;
  margin: 0 auto 10px;
  padding-left: 20px;
  font-size: 12px;
  color: #777;
  height: 14px;
}

/* Mobile */

@media (max-width: 600px) {
  #chat {
    padding: 25px 18px 150px;
  }

  #input-area {
    padding: 18px 14px 22px;
  }

  body.started #input-area {
    top: calc(100% - 122px);
  }

  .message {
    max-width: 95%;
  }

  .agent {
    max-width: calc(100% - 60px);
  }

  .agent-avatar {
    width: 46px;
    height: 46px;
  }

  #branding {
    font-size: 28px;
    gap: 12px;
  }

  #branding img {
    width: 64px;
    height: 64px;
  }
}
</style>
</head>

<body>

<div id="chat"></div>

<div id="input-area">

  <div id="status"></div>

  <div id="branding">
    <img src="mascot.png" alt="Croissant">
    <span><strong>Croissant</strong></span>
  </div>

  <div id="input-container">
    <input
      id="query"
      placeholder="Message..."
      autocomplete="off"
    />
    <button id="send" onclick="send()">Send</button>
  </div>

</div>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("query");
const button = document.getElementById("send");
const status = document.getElementById("status");

let busy = false;

function addMessage(text, type) {
  if (type === "agent") {
    const row = document.createElement("div");
    row.className = "agent-row";

    const avatar = document.createElement("img");
    avatar.className = "agent-avatar";
    avatar.src = "mascot.png";
    avatar.alt = "Agent";

    const div = document.createElement("div");
    div.className = "message agent";
    div.textContent = text;

    row.appendChild(avatar);
    row.appendChild(div);
    chat.appendChild(row);

    window.scrollTo(0, document.body.scrollHeight);
    return div;
  }

  const div = document.createElement("div");
  div.className = `message ${type}`;
  div.textContent = text;

  chat.appendChild(div);

  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

async function send() {
  const query = input.value.trim();

  if (!query || busy) return;

  busy = true;

  document.body.classList.add("started");

  button.disabled = true;
  input.disabled = true;

  addMessage(query, "user");
  input.value = "";

  const response = addMessage("Thinking...", "agent");

  status.textContent = "PROCESSING";

  try {
    const res = await fetch(
      `https://croissant-mz0o.onrender.com/croissant?query=${encodeURIComponent(query)}`,
      { method: "POST" }
    );

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    response.textContent = await res.text();

  } catch (err) {
    response.textContent = `Error: ${err.message}`;

  } finally {
    busy = false;

    button.disabled = false;
    input.disabled = false;

    status.textContent = "";

    input.focus();

    window.scrollTo({
      top: document.body.scrollHeight,
      behavior: "smooth"
    });
  }
}

input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});
</script>

</body>
</html>
